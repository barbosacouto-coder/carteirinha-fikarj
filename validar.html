<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIKARJ - Validação de Carteirinha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Montserrat',sans-serif;background:#0b0f17;color:#f3f4f6}.font-cinzel{font-family:'Cinzel',serif}</style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center">
  <h1 class="text-xl md:text-2xl font-extrabold text-white font-cinzel text-center max-w-xl">FEDERAÇÃO INTERESTILOS DE KARATÊ DO ESTADO DO RIO DE JANEIRO</h1>
  <p class="text-gray-400 text-xs mt-1 mb-8">Validação de carteirinha oficial</p>
  <div id="resultado" class="w-full max-w-md rounded-2xl border border-gray-800 bg-gray-900/90 p-6 shadow-2xl text-center">
    <p class="text-gray-400 text-sm">Consultando...</p>
  </div>
  <p class="text-gray-500 text-[11px] mt-6 max-w-md text-center">Esta consulta confirma o vínculo e a situação do filiado na FIKARJ. Para validade oficial, apresente também documento de identidade com foto.</p>
  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
    const box = document.getElementById('resultado');
    function linha(rotulo, valor) {
      const d = document.createElement('div');
      d.className = 'text-left border-t border-gray-800 py-2';
      d.innerHTML = '<span class="block text-[10px] uppercase tracking-wider text-gray-500 font-bold"></span><span class="block font-bold text-white text-sm"></span>';
      d.children[0].textContent = rotulo; d.children[1].textContent = valor || '-';
      return d;
    }
    (async () => {
      const t = new URLSearchParams(location.search).get('t');
      box.innerHTML = '';
      if (!t) { box.innerHTML = '<p class="text-red-400 font-bold">Código de validação ausente.</p>'; return; }
      const { data, error } = await sb.rpc('validar_qr', { p_token: t });
      if (error) { box.innerHTML = '<p class="text-red-400 font-bold">Não foi possível consultar agora.</p>'; return; }
      if (!data) { box.innerHTML = '<p class="text-red-400 font-bold text-lg">CARTEIRINHA NÃO ENCONTRADA</p><p class="text-gray-400 text-sm mt-2">O código não corresponde a nenhum filiado.</p>'; return; }
      const ativo = /202[67]/.test(String(data.anuidade));
      const sel = document.createElement('div');
      sel.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-black mb-4 ' + (ativo ? 'bg-green-600 text-white' : 'bg-red-600 text-white');
      sel.textContent = ativo ? 'FILIADO REGULAR ' + data.anuidade : 'FILIADO INATIVO';
      box.appendChild(sel);
      box.appendChild(linha('Nome', data.nome));
      box.appendChild(linha('Graduação', data.graduacao));
      box.appendChild(linha('Estilo', data.estilo));
      box.appendChild(linha('Associação', data.associacao_nome));
      box.appendChild(linha('Registro FIKARJ', data.registro == null ? '-' : String(data.registro).padStart(4, '0')));
    })();
  </script>
</body>
</html>
